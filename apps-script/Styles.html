<style>
  /* =====================================================================
   * Theme: cream background, beige panels, periwinkle + peach highlights,
   * rust section labels, heavy navy headings, green logo.
   * To change the look, edit the colours here only.
   * ===================================================================== */
  :root {
    --paper: #f6f3ef;        /* page background */
    --panel: #efe8df;        /* sidebar, table headers, soft panels */
    --surface: #ffffff;      /* cards */
    --surface-2: #f8f4ef;    /* inputs disabled, dropzone */
    --line: #e6ddd2;
    --line-2: #ddd3c6;       /* input borders */
    --ink: #1b2234;          /* headings, primary buttons */
    --ink-2: #3f4654;
    --muted: #6b7180;
    --rust: #a3440f;         /* section labels */
    --peri: #dde6f7;         /* periwinkle highlight */
    --peri-2: #cfdcf3;
    --peri-border: #b5c7ec;
    --peri-strong: #7f9bd8;
    --peach: #f6cfa8;        /* peach highlight */
    --peach-soft: #f9e4d0;
    --peach-border: #ecb27f;
    --peach-strong: #e9a46a;
    --green: #3da64a;        /* logo */
    --danger: #c43d3d;
    --success: #2f9e6e;
    --radius: 14px;
    --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; min-height: 100%; }
  body { font-family: var(--font); color: var(--ink); background: var(--paper); font-size: 13.5px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  h1, h2 { margin: 0; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .label { font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--rust); margin: 0 0 12px; }

  /* ---------- Brand ---------- */
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-mark { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex-shrink: 0;
    background: #ecf7ee; border: 1px solid #cfe9d4; color: var(--green); }
  .brand-mark svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .brand-name { color: var(--ink); font-weight: 800; font-size: 16px; letter-spacing: -0.01em; }
  .brand-sub { color: var(--muted); font-size: 12px; }

  /* ---------- Login ---------- */
  .login { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--paper); }
  .login-card { width: 100%; max-width: 400px; background: var(--surface); border: 1px solid var(--line); border-radius: 20px;
    padding: 36px; display: flex; flex-direction: column; gap: 14px; }
  .login-card h1 { font-weight: 900; font-size: 28px; letter-spacing: -0.03em; margin-top: 12px; }
  .login-card p { margin: 0; }

  /* ---------- Shell ---------- */
  .shell { display: flex; min-height: 100vh; }
  .sidebar { width: 248px; flex-shrink: 0; background: var(--panel); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; padding: 24px 16px; position: sticky; top: 0; height: 100vh; }
  .sidebar .brand { padding: 0 8px 22px; border-bottom: 1px solid var(--line); }
  .nav { display: flex; flex-direction: column; gap: 4px; margin-top: 20px; }
  .nav-item { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 12px; border: 1px solid transparent;
    color: var(--ink-2); text-decoration: none; font-weight: 500; transition: background .15s, border-color .15s, color .15s; }
  .nav-item svg { width: 18px; height: 18px; fill: currentColor; opacity: .8; }
  .nav-item:hover { background: var(--surface); border-color: var(--line); color: var(--ink); }
  .nav-item.active { background: var(--peri-2); border-color: var(--peri-border); color: var(--ink); font-weight: 700; }
  .nav-item.active svg { opacity: 1; }
  .sidebar-footer { margin-top: auto; display: flex; flex-direction: column; gap: 2px; border-top: 1px solid var(--line); padding-top: 14px; }
  .btn-link-light { background: none; border: 0; color: var(--muted); text-align: left; padding: 9px 14px; border-radius: 10px; cursor: pointer; font: inherit; }
  .btn-link-light:hover { color: var(--ink); background: var(--surface); }

  .main { flex: 1; min-width: 0; }
  .topbar { display: flex; align-items: center; gap: 14px; padding: 22px 32px 6px; position: sticky; top: 0; z-index: 5;
    background: rgba(246, 243, 239, .92); backdrop-filter: blur(8px); }
  .page-title { font-weight: 900; font-size: 28px; letter-spacing: -0.03em; }
  .page-sub { margin: 2px 0 0; color: var(--muted); font-size: 13.5px; }
  .content { padding: 16px 32px 48px; }

  /* ---------- Cards ---------- */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; margin-bottom: 20px; }
  .card-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 18px; }
  .card-head h2 { font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--rust); }
  .card-head .muted { font-size: 12px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }

  /* ---------- Charts (pure HTML/CSS) ---------- */
  .chart-empty { color: var(--muted); padding: 32px 0; text-align: center; }
  .hbar { display: grid; grid-template-columns: minmax(110px, 38%) 1fr auto; gap: 12px; align-items: center; margin: 11px 0; }
  .hbar-label { font-size: 13px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; gap: 8px; }
  .hbar-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .hbar-track { display: block; background: var(--panel); border-radius: 999px; height: 10px; overflow: hidden; }
  .hbar-fill { display: block; height: 100%; border-radius: 999px; transition: width .5s cubic-bezier(.2,.8,.2,1); }
  .hbar-value { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
  /* ---------- Dashboard ---------- */
  .dash-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .seg { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 2px; }
  .seg button { border: 0; background: transparent; font: inherit; font-weight: 600; color: var(--muted); padding: 6px 13px; border-radius: 9px; cursor: pointer; }
  .seg button:hover { color: var(--ink); }
  .seg button.active { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(27, 34, 52, .08); }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; }
  .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px;
    display: flex; flex-direction: column; gap: 4px; min-width: 0; transition: transform .18s, box-shadow .18s; }
  .kpi:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(27, 34, 52, .06); }
  .kpi-label { font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--rust); }
  .kpi-value { font-size: 24px; font-weight: 900; letter-spacing: -0.03em; line-height: 1.2; }
  .kpi-value--text { font-size: 17px; letter-spacing: -0.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 3px 0 2px; }
  .kpi-sub { font-size: 12px; color: var(--muted); }
  .kpi--peri { background: var(--peri); border-color: var(--peri-border); }
  .kpi--peri .kpi-label { color: #3b4f80; }
  .kpi--peach { background: var(--peach); border-color: var(--peach-border); }
  .kpi--peach .kpi-label, .kpi--peach .kpi-sub { color: #7a3410; }
  .trend-pill { display: inline-block; font-weight: 700; border-radius: 6px; padding: 0 5px; background: rgba(255, 255, 255, .7); }
  .trend-pill.up { color: var(--rust); }
  .trend-pill.down { color: var(--success); }
  .dash-grid { display: grid; grid-template-columns: 1.8fr 1fr; gap: 20px; }
  .dash-grid > *, .grid-2 > * { min-width: 0; }
  #view-dashboard .grid-2 { align-items: start; }   /* let cards shrink instead of overflowing */
  .trend { display: flex; align-items: flex-end; gap: 8px; height: 200px; padding-top: 6px;
    background: repeating-linear-gradient(to top, transparent 0, transparent calc(25% - 1px), var(--line) calc(25% - 1px), var(--line) 25%);
    background-size: 100% calc(100% - 26px); background-repeat: no-repeat; }
  .tbar { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; }
  .tbar-val { font-size: 10.5px; font-weight: 700; color: var(--ink-2); margin-bottom: 4px; white-space: nowrap; }
  .tbar-col { width: 100%; max-width: 40px; background: #cbd8f1; border-radius: 6px 6px 2px 2px; transition: height .5s cubic-bezier(.2,.8,.2,1), background .15s; }
  .tbar.in .tbar-col { background: linear-gradient(180deg, #a9bde8, #7f9bd8); }
  .tbar:last-child .tbar-col { background: linear-gradient(180deg, #f6c9a0, var(--peach-strong)); }
  .tbar-col:hover { filter: brightness(1.05); }
  .tbar-label { margin-top: 8px; font-size: 11px; color: var(--muted); white-space: nowrap; height: 18px; }
  .donut-wrap { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  .donut { width: 150px; height: 150px; border-radius: 50%; position: relative; flex-shrink: 0; }
  .donut-center { position: absolute; inset: 22%; background: var(--surface); border-radius: 50%; display: flex; flex-direction: column;
    align-items: center; justify-content: center; }
  .donut-center b { font-size: 17px; font-weight: 900; letter-spacing: -0.02em; }
  .donut-center span { font-size: 11px; color: var(--muted); }
  .legend { list-style: none; margin: 0; padding: 0; flex: 1; min-width: 150px; display: flex; flex-direction: column; gap: 8px; }
  .legend li { display: flex; align-items: center; gap: 8px; font-size: 12.5px; }
  .legend i { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
  .legend-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); }
  .legend-pct { font-weight: 700; font-variant-numeric: tabular-nums; }
  .recent-list { list-style: none; margin: 0; padding: 0; }
  .recent-list li { display: flex; justify-content: space-between; gap: 14px; padding: 10px 8px; border-bottom: 1px solid var(--line); cursor: pointer; border-radius: 8px; }
  .recent-list li:last-child { border-bottom: 0; }
  .recent-list li:hover { background: var(--surface-2); }
  .rl-main, .rl-side { display: flex; flex-direction: column; min-width: 0; }
  .rl-main b, .rl-side b { font-weight: 700; font-size: 13px; }
  .rl-main span, .rl-side span { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rl-side { align-items: flex-end; text-align: right; flex-shrink: 0; }

  /* ---------- Add Expense: search, recent, tiles ---------- */
  .picker-search { display: block; position: relative; margin-bottom: 22px; }
  .picker-search input { font-size: 14.5px; padding: 12px 14px 12px 42px; border-radius: 12px; }
  .picker-search svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; fill: var(--muted); pointer-events: none; }
  .picker-block { margin-bottom: 22px; }
  .recent-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .recent-chip { display: inline-flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line);
    border-radius: 12px; padding: 8px 14px 8px 8px; cursor: pointer; font: inherit; color: var(--ink); transition: border-color .15s, transform .15s; }
  .recent-chip:hover { border-color: var(--peri-border); transform: translateY(-1px); }
  .recent-chip .tile-icon { width: 30px; height: 30px; border-radius: 8px; }
  .recent-chip .tile-icon svg { width: 16px; height: 16px; }
  .recent-chip small { display: block; color: var(--muted); font-size: 11px; }
  .tile-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column;
    gap: 8px; min-height: 104px; cursor: pointer; text-align: left; font: inherit; color: var(--ink); transition: border-color .15s, transform .15s, box-shadow .15s; }
  .tile:hover { border-color: var(--peri-border); transform: translateY(-2px); box-shadow: 0 8px 20px rgba(27, 34, 52, .05); }
  .tile:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(127, 155, 216, .35); }
  .tile-icon { width: 38px; height: 38px; border-radius: 10px; background: var(--panel); display: grid; place-items: center; flex-shrink: 0; }
  .tile-icon svg { width: 20px; height: 20px; fill: var(--ink); }
  .tile-name { font-weight: 700; line-height: 1.25; }
  .tile-hint { font-size: 12px; color: var(--muted); }
  .tile--other { border-style: dashed; background: transparent; }
  .tile--other .tile-icon { background: var(--peach); }
  .results { display: flex; flex-direction: column; gap: 8px; }
  .result { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 16px; cursor: pointer; text-align: left; font: inherit; color: var(--ink); width: 100%; }
  .result:hover, .result.active { border-color: var(--peri-border); background: #fbfcff; }
  .result b { font-weight: 700; }
  .result small { display: block; color: var(--muted); font-size: 12px; }
  .result mark { background: #fde8c8; color: inherit; border-radius: 3px; padding: 0 1px; }
  .crumb { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
  .pill { background: var(--peri); border: 1px solid var(--peri-border); border-radius: 999px; padding: 6px 14px; font-weight: 700; }
  .link-pill { font: inherit; font-weight: 700; color: var(--ink); cursor: pointer; }
  .link-pill:hover { border-color: var(--peri-strong); }
  .crumb .tile-icon { width: 34px; height: 34px; }
  .pill--peach { background: var(--peach); border-color: var(--peach-border); }
  .link-btn { border: 0; background: none; font: inherit; color: #3b5fb0; font-weight: 600; cursor: pointer; padding: 4px 6px; }
  .link-btn:hover { text-decoration: underline; }
  .type-chips { display: flex; gap: 10px; flex-wrap: wrap; }
  .type-chip { border: 1px solid var(--line-2); background: var(--surface); border-radius: 12px; padding: 12px 18px; font: inherit;
    font-weight: 600; color: var(--ink); cursor: pointer; transition: background .15s, border-color .15s, color .15s; }
  .type-chip:hover { border-color: var(--ink); }

  /* ---------- Forms ---------- */
  .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .field > span { font-size: 12px; font-weight: 600; color: var(--ink-2); }
  .field .req { color: var(--rust); }
  input, select, textarea { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line-2);
    border-radius: 10px; padding: 8px 11px; width: 100%; transition: border-color .15s, box-shadow .15s; }
  textarea { resize: vertical; min-height: 80px; }
  input:hover, select:hover, textarea:hover { border-color: #cbbfae; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--peri-strong); box-shadow: 0 0 0 4px rgba(127, 155, 216, .2); }
  input:disabled, select:disabled { background: var(--surface-2); color: var(--muted); }
  .field.invalid input, .field.invalid select, .field.invalid textarea { border-color: var(--danger); box-shadow: 0 0 0 4px rgba(196, 61, 61, .08); }
  .field-error { color: var(--danger); font-size: 12px; }
  .form-error { color: var(--danger); background: #fdf1f1; border: 1px solid #f3caca; padding: 10px 14px; border-radius: 10px; margin: 14px 0 0; }
  .form-card { max-width: 1040px; }
  .form-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px 18px; }
  .form-grid .span-2 { grid-column: span 2; }
  .form-grid .span-3 { grid-column: 1 / -1; }
  .form-section { display: flex; align-items: center; gap: 10px; grid-column: 1 / -1; margin-top: 6px;
    font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--rust); }
  .form-section::after { content: ''; flex: 1; height: 1px; background: var(--line); }
  .form-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line); }
  .amount-input { position: relative; }
  .amount-input::before { content: '₹'; position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  .amount-input input { padding-left: 28px; }
  .dropzone { border: 1.5px dashed #d6cdbd; border-radius: 14px; padding: 16px; display: flex; align-items: center; gap: 14px;
    background: var(--surface-2); cursor: pointer; transition: border-color .15s, background .15s; }
  .dropzone:hover, .dropzone.drag { border-color: var(--peri-strong); background: #eef3fc; }
  .dropzone input { display: none; }
  .dropzone-icon { width: 40px; height: 40px; border-radius: 11px; background: var(--surface); border: 1px solid var(--line);
    display: grid; place-items: center; color: var(--ink); font-size: 18px; flex-shrink: 0; }
  .dropzone-text strong { display: block; font-weight: 600; }
  .dropzone-text span { color: var(--muted); font-size: 12px; }
  .file-chip { display: inline-flex; align-items: center; gap: 8px; margin-left: auto; background: var(--surface);
    border: 1px solid var(--line); border-radius: 999px; padding: 5px 6px 5px 12px; font-size: 12px; }
  .file-chip button { border: 0; background: var(--panel); border-radius: 50%; width: 22px; height: 22px; cursor: pointer; }

  /* ---------- Buttons ---------- */
  .btn { font: inherit; font-weight: 700; border-radius: 10px; padding: 8px 15px; cursor: pointer; border: 1px solid transparent;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap;
    transition: background .15s, border-color .15s, box-shadow .15s, transform .05s, color .15s; }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  .btn-primary { background: var(--ink); color: #fff; }
  .btn-primary:hover:not(:disabled) { background: #000; box-shadow: 0 8px 20px rgba(27, 34, 52, .2); }
  .btn-ghost { background: var(--surface); color: var(--ink-2); border-color: var(--line-2); }
  .btn-ghost:hover:not(:disabled) { border-color: var(--ink); color: var(--ink); }
  .btn-block { width: 100%; }
  .btn-sm { padding: 6px 11px; font-size: 12px; border-radius: 8px; }
  .btn.loading::before { content: ''; width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent;
    border-radius: 50%; animation: spin .7s linear infinite; }
  .icon-btn { border: 0; background: transparent; width: 38px; height: 38px; border-radius: 10px; cursor: pointer;
    display: grid; place-items: center; color: var(--ink-2); font-size: 16px; }
  .icon-btn:hover { background: rgba(27, 34, 52, .05); }
  .icon-btn.menu-btn { display: none; }
  .icon-btn svg { width: 22px; height: 22px; fill: currentColor; }

  /* ---------- Toolbar (search + date + filters) ---------- */
  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; position: relative; }
  .tb-search { position: relative; flex: 1; min-width: 220px; display: block; }
  .tb-search input { padding-left: 36px; height: 38px; }
  .tb-search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 17px; height: 17px; fill: var(--muted); pointer-events: none; }
  .tb-btn { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px; border: 1px solid var(--line-2); border-radius: 10px;
    background: var(--surface); font: inherit; font-weight: 600; color: var(--ink-2); cursor: pointer; white-space: nowrap; transition: border-color .15s, background .15s; }
  .tb-btn svg { width: 16px; height: 16px; fill: currentColor; }
  .tb-btn:hover { border-color: var(--ink); }
  .tb-btn.on { background: var(--peri); border-color: var(--peri-border); color: var(--ink); }
  .tb-caret { font-size: 10px; color: var(--muted); }
  .tb-count { background: var(--ink); color: #fff; border-radius: 999px; font-size: 11px; min-width: 18px; height: 18px;
    display: inline-grid; place-items: center; padding: 0 5px; }
  .tb-spacer { flex: 1; }
  .toolbar .btn-sm { height: 38px; padding: 0 14px; font-size: 13px; }
  .pop { position: relative; }
  .pop-panel { display: none; position: absolute; top: calc(100% + 6px); left: 0; z-index: 30; background: var(--surface);
    border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 18px 40px rgba(27, 34, 52, .12); padding: 14px; width: 330px; }
  .pop-panel.align-right { left: auto; right: 0; }
  .pop.open .pop-panel { display: block; animation: fade-up .15s ease-out; }
  .pop.open .pop-panel--grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 440px; }
  .pop-foot { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--line); padding-top: 12px; }
  .presets { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .presets button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 7px 10px; font: inherit;
    font-size: 12.5px; text-align: left; cursor: pointer; color: var(--ink-2); }
  .presets button:hover { border-color: var(--peri-border); background: var(--peri); color: var(--ink); }
  .pop-sep { font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--rust); margin: 14px 0 8px; }
  .pop-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 12px; }
  .fchip { display: inline-flex; align-items: center; gap: 6px; background: var(--peri); border: 1px solid var(--peri-border); border-radius: 999px;
    padding: 3px 4px 3px 11px; font-size: 12px; font-weight: 600; color: #2c3d66; }
